    <!-- minced texture (dots) -->
    <circle cx="-70" cy="-15" r="4" fill="#fef2f2" opacity="0.5"/>
    <circle cx="-30" cy="-25" r="3" fill="#fef2f2" opacity="0.5"/>
    <circle cx="20" cy="-15" r="4" fill="#fef2f2" opacity="0.5"/>
    <circle cx="60" cy="-20" r="3" fill="#fef2f2" opacity="0.5"/>
    <circle cx="-50" cy="10" r="3" fill="#fef2f2" opacity="0.5"/>
    <circle cx="0" cy="20" r="4" fill="#fef2f2" opacity="0.5"/>
    <circle cx="40" cy="15" r="3" fill="#fef2f2" opacity="0.5"/>
    <circle cx="-80" cy="25" r="3" fill="#fef2f2" opacity="0.5"/>
    <circle cx="80" cy="25" r="4" fill="#fef2f2" opacity="0.5"/>
    <circle cx="-20" cy="35" r="3" fill="#fef2f2" opacity="0.5"/>
    <circle cx="50" cy="35" r="3" fill="#fef2f2" opacity="0.5"/>
    <!-- darker accents -->
    <circle cx="-60" cy="0" r="5" fill="#7f1d1d" opacity="0.5"/>
    <circle cx="30" cy="-5" r="6" fill="#7f1d1d" opacity="0.5"/>
