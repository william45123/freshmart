<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  
  
  
  <g transform="translate(200, 200)">
    <!-- stems bunch -->
    <line x1="0" y1="100" x2="-30" y2="-30" stroke="#16a34a" stroke-width="2"/>
    <line x1="0" y1="100" x2="0" y2="-50" stroke="#16a34a" stroke-width="2"/>
    <line x1="0" y1="100" x2="30" y2="-30" stroke="#16a34a" stroke-width="2"/>
    <line x1="0" y1="100" x2="-50" y2="0" stroke="#16a34a" stroke-width="2"/>
    <line x1="0" y1="100" x2="50" y2="0" stroke="#16a34a" stroke-width="2"/>
    <!-- string tie -->
    <ellipse cx="0" cy="70" rx="12" ry="6" fill="#92400e"/>
    <!-- leaves (clovers) -->
    <g transform="translate(-50, 0)">
      <circle cx="-8" cy="0" r="10" fill="#22c55e"/>
      <circle cx="8" cy="0" r="10" fill="#22c55e"/>
      <circle cx="0" cy="-10" r="10" fill="#22c55e"/>
      <circle cx="0" cy="8" r="8" fill="#16a34a"/>
    </g>
    <g transform="translate(-30, -30)">
      <circle cx="-8" cy="0" r="9" fill="#22c55e"/>
      <circle cx="8" cy="0" r="9" fill="#22c55e"/>
      <circle cx="0" cy="-9" r="9" fill="#22c55e"/>
    </g>
    <g transform="translate(0, -50)">
      <circle cx="-9" cy="0" r="10" fill="#22c55e"/>
      <circle cx="9" cy="0" r="10" fill="#22c55e"/>
      <circle cx="0" cy="-10" r="10" fill="#22c55e"/>
      <circle cx="0" cy="9" r="8" fill="#16a34a"/>
    </g>
    <g transform="translate(30, -30)">
      <circle cx="-8" cy="0" r="9" fill="#22c55e"/>
      <circle cx="8" cy="0" r="9" fill="#22c55e"/>
      <circle cx="0" cy="-9" r="9" fill="#22c55e"/>
    </g>
    <g transform="translate(50, 0)">
      <circle cx="-8" cy="0" r="10" fill="#22c55e"/>
      <circle cx="8" cy="0" r="10" fill="#22c55e"/>
      <circle cx="0" cy="-10" r="10" fill="#22c55e"/>
      <circle cx="0" cy="8" r="8" fill="#16a34a"/>
    </g>
  </g>
  

</svg>