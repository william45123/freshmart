<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <g transform="translate(200, 200)">
    <!-- Main root body (knobby shape) -->
    <path d="M -100 0 Q -110 -20 -90 -40 Q -50 -50 -20 -30 Q 20 -45 60 -30 Q 100 -40 110 -10 Q 115 20 90 35 Q 60 50 30 40 Q -10 50 -50 30 Q -90 35 -100 0 Z"
          fill="#fde68a" stroke="#a16207" stroke-width="2"/>
    <!-- Sub-knobs (little protrusions) -->
    <ellipse cx="-95" cy="-30" rx="18" ry="12" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/>
    <ellipse cx="95" cy="-25" rx="20" ry="14" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/>
    <ellipse cx="50" cy="35" rx="18" ry="10" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/>
    <!-- Wrinkle/texture lines -->
    <path d="M -80 -15 Q -50 -8 -20 -10" stroke="#a16207" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M -50 5 Q 0 12 50 5" stroke="#a16207" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 30 -15 Q 60 -10 80 -5" stroke="#a16207" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- highlight -->
    <ellipse cx="-30" cy="-18" rx="25" ry="8" fill="#fef9c3" opacity="0.5"/>
  </g>
</svg>