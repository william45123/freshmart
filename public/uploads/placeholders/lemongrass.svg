<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <g>
    <!-- Multiple stalks -->
    <g transform="translate(180, 200) rotate(-8)">
      <path d="M -8 -100 L 8 -100 L 5 100 L -5 100 Z" fill="#bef264" stroke="#65a30d" stroke-width="2"/>
      <!-- top brush (leaves) -->
      <path d="M -8 -100 L -12 -130 M 0 -100 L -2 -135 M 8 -100 L 12 -130" stroke="#65a30d" stroke-width="2"/>
      <!-- node lines -->
      <line x1="-7" y1="-30" x2="7" y2="-30" stroke="#65a30d" stroke-width="1.5" opacity="0.7"/>
      <line x1="-6" y1="30" x2="6" y2="30" stroke="#65a30d" stroke-width="1.5" opacity="0.7"/>
      <!-- bulb at bottom -->
      <ellipse cx="0" cy="100" rx="14" ry="20" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    </g>
    <g transform="translate(220, 200) rotate(8)">
      <path d="M -8 -100 L 8 -100 L 5 100 L -5 100 Z" fill="#bef264" stroke="#65a30d" stroke-width="2"/>
      <path d="M -8 -100 L -12 -130 M 0 -100 L -2 -135 M 8 -100 L 12 -130" stroke="#65a30d" stroke-width="2"/>
      <line x1="-7" y1="-30" x2="7" y2="-30" stroke="#65a30d" stroke-width="1.5" opacity="0.7"/>
      <line x1="-6" y1="30" x2="6" y2="30" stroke="#65a30d" stroke-width="1.5" opacity="0.7"/>
      <ellipse cx="0" cy="100" rx="14" ry="20" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    </g>
    <g transform="translate(150, 210) rotate(-15)">
      <path d="M -7 -90 L 7 -90 L 4 90 L -4 90 Z" fill="#a3e635" stroke="#65a30d" stroke-width="2"/>
      <path d="M 0 -90 L -2 -120" stroke="#65a30d" stroke-width="2"/>
      <ellipse cx="0" cy="90" rx="12" ry="17" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
    </g>
  </g>
</svg>