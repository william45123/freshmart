<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <g>
    <!-- Muffin 1 -->
    <g transform="translate(140, 200)">
      <!-- wrapper -->
      <path d="M -45 0 L 45 0 L 40 50 L -40 50 Z" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
      <!-- vertical wrapper ridges -->
      <line x1="-30" y1="0" x2="-26" y2="50" stroke="#fbbf24" stroke-width="1"/>
      <line x1="-15" y1="0" x2="-12" y2="50" stroke="#fbbf24" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="50" stroke="#fbbf24" stroke-width="1"/>
      <line x1="15" y1="0" x2="12" y2="50" stroke="#fbbf24" stroke-width="1"/>
      <line x1="30" y1="0" x2="26" y2="50" stroke="#fbbf24" stroke-width="1"/>
      <!-- muffin top (domed) -->
      <ellipse cx="0" cy="-5" rx="55" ry="35" fill="#d97706" stroke="#78350f" stroke-width="2"/>
      <!-- blueberries -->
      <circle cx="-25" cy="-15" r="6" fill="#5b21b6"/>
      <circle cx="-10" cy="-25" r="6" fill="#5b21b6"/>
      <circle cx="10" cy="-20" r="6" fill="#5b21b6"/>
      <circle cx="25" cy="-10" r="5" fill="#5b21b6"/>
      <circle cx="0" cy="-10" r="5" fill="#5b21b6"/>
      <!-- shine on berries -->
      <circle cx="-27" cy="-17" r="2" fill="#a78bfa"/>
      <circle cx="-12" cy="-27" r="2" fill="#a78bfa"/>
      <circle cx="8" cy="-22" r="2" fill="#a78bfa"/>
    </g>
    <!-- Muffin 2 -->
    <g transform="translate(260, 220)">
      <path d="M -45 0 L 45 0 L 40 50 L -40 50 Z" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
      <line x1="-30" y1="0" x2="-26" y2="50" stroke="#fbbf24" stroke-width="1"/>
      <line x1="-15" y1="0" x2="-12" y2="50" stroke="#fbbf24" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="50" stroke="#fbbf24" stroke-width="1"/>
      <line x1="15" y1="0" x2="12" y2="50" stroke="#fbbf24" stroke-width="1"/>
      <line x1="30" y1="0" x2="26" y2="50" stroke="#fbbf24" stroke-width="1"/>
      <ellipse cx="0" cy="-5" rx="55" ry="35" fill="#d97706" stroke="#78350f" stroke-width="2"/>
      <circle cx="-20" cy="-15" r="6" fill="#5b21b6"/>
      <circle cx="0" cy="-22" r="6" fill="#5b21b6"/>
      <circle cx="20" cy="-15" r="6" fill="#5b21b6"/>
      <circle cx="-10" cy="-5" r="5" fill="#5b21b6"/>
      <circle cx="15" cy="-8" r="5" fill="#5b21b6"/>
      <circle cx="-22" cy="-17" r="2" fill="#a78bfa"/>
      <circle cx="-2" cy="-24" r="2" fill="#a78bfa"/>
    </g>
  </g>
</svg>