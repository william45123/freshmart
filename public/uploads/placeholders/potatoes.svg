<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <g>
    <!-- Potato 1 -->
    <g transform="translate(160, 200)">
      <ellipse cx="0" cy="0" rx="60" ry="45" fill="#d6b48b" stroke="#78350f" stroke-width="2"/>
      <!-- Eyes (potato bud spots) -->
      <circle cx="-20" cy="-10" r="3" fill="#78350f"/>
      <circle cx="15" cy="5" r="3" fill="#78350f"/>
      <circle cx="-25" cy="20" r="2" fill="#78350f"/>
      <!-- Highlight -->
      <ellipse cx="-15" cy="-15" rx="20" ry="12" fill="#e7c79a" opacity="0.6"/>
    </g>
    <!-- Potato 2 -->
    <g transform="translate(250, 230)">
      <ellipse cx="0" cy="0" rx="55" ry="42" fill="#c9a874" stroke="#78350f" stroke-width="2"/>
      <circle cx="-10" cy="-5" r="2.5" fill="#78350f"/>
      <circle cx="20" cy="-10" r="3" fill="#78350f"/>
      <circle cx="0" cy="15" r="2.5" fill="#78350f"/>
      <ellipse cx="-10" cy="-15" rx="18" ry="10" fill="#dec594" opacity="0.6"/>
    </g>
    <!-- Potato 3 (small, behind) -->
    <g transform="translate(200, 175)">
      <ellipse cx="0" cy="0" rx="40" ry="32" fill="#bb9a6b" stroke="#78350f" stroke-width="1.5"/>
      <circle cx="-5" cy="-3" r="2" fill="#78350f"/>
      <circle cx="12" cy="5" r="2" fill="#78350f"/>
    </g>
  </g>
</svg>