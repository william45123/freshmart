    <!-- flesh lines -->
    <path d="M -110 -25 Q -60 -15 -20 -10" stroke="#fde68a" stroke-width="3" opacity="0.7" fill="none"/>
    <path d="M -90 0 Q -30 5 30 0" stroke="#fde68a" stroke-width="3" opacity="0.7" fill="none"/>
    <path d="M -60 20 Q 0 25 60 20" stroke="#fde68a" stroke-width="2" opacity="0.6" fill="none"/>
    <path d="M 20 -25 Q 70 -20 110 -15" stroke="#fde68a" stroke-width="2" opacity="0.6" fill="none"/>
  </g>
  

</svg>