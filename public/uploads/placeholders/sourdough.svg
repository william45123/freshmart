<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  
  
  
  <g transform="translate(200, 210)">
    <!-- loaf body -->
    <ellipse cx="0" cy="20" rx="120" ry="65" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <ellipse cx="0" cy="10" rx="115" ry="55" fill="#fbbf24" opacity="0.5"/>
    <!-- scoring marks -->
    <path d="M -70 -20 Q -50 -30 -30 -20" fill="none" stroke="#92400e" stroke-width="2"/>
    <path d="M -30 -25 Q -10 -35 10 -25" fill="none" stroke="#92400e" stroke-width="2"/>
    <path d="M 10 -20 Q 30 -30 50 -20" fill="none" stroke="#92400e" stroke-width="2"/>
    <path d="M 50 -15 Q 70 -25 80 -15" fill="none" stroke="#92400e" stroke-width="2"/>
    <!-- crust texture -->
    <circle cx="-80" cy="20" r="3" fill="#92400e" opacity="0.4"/>
    <circle cx="-40" cy="30" r="3" fill="#92400e" opacity="0.4"/>
    <circle cx="0" cy="35" r="3" fill="#92400e" opacity="0.4"/>
    <circle cx="50" cy="30" r="3" fill="#92400e" opacity="0.4"/>
    <circle cx="80" cy="25" r="3" fill="#92400e" opacity="0.4"/>
    <!-- flour dusting -->
    <circle cx="-50" cy="-5" r="2" fill="#fef3c7"/>
    <circle cx="20" cy="0" r="2" fill="#fef3c7"/>
    <circle cx="-20" cy="-10" r="2" fill="#fef3c7"/>
    <circle cx="60" cy="-5" r="2" fill="#fef3c7"/>
  </g>
  

</svg>