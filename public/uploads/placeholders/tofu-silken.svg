<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <g transform="translate(200, 200)">
    <!-- Tofu block (rounded edges, glossy) -->
    <rect x="-90" y="-50" width="180" height="100" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <!-- Top face highlight -->
    <rect x="-85" y="-48" width="170" height="20" rx="8" fill="#fffbeb" opacity="0.7"/>
    <!-- Front face -->
    <rect x="-90" y="-30" width="180" height="80" rx="8" fill="#fefce8" opacity="0"/>
    <!-- Soft shadow lines (silken texture - barely visible) -->
    <line x1="-70" y1="-10" x2="70" y2="-10" stroke="#fef3c7" stroke-width="1" opacity="0.4"/>
    <line x1="-70" y1="10" x2="70" y2="10" stroke="#fef3c7" stroke-width="1" opacity="0.4"/>
    <line x1="-70" y1="30" x2="70" y2="30" stroke="#fef3c7" stroke-width="1" opacity="0.4"/>
    <!-- Water around it (in package) -->
    <ellipse cx="0" cy="60" rx="100" ry="10" fill="#dbeafe" opacity="0.5"/>
    <!-- Brand label -->
    <rect x="-30" y="0" width="60" height="20" fill="#fff" stroke="#a16207" stroke-width="0.5"/>
    <text x="0" y="14" text-anchor="middle" font-family="serif" font-size="10" font-style="italic" fill="#92400e">silken</text>
  </g>
</svg>