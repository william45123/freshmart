<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <g transform="translate(200, 210)">
    <!-- Loaf body (rectangular) -->
    <path d="M -110 -40 Q -120 -50 -100 -55 L 100 -55 Q 120 -50 110 -40 L 110 50 Q 110 70 90 70 L -90 70 Q -110 70 -110 50 Z"
          fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <!-- Top crust (lighter, slightly bumpy) -->
    <path d="M -100 -55 Q -50 -65 0 -60 Q 50 -65 100 -55" stroke="#451a03" stroke-width="2" fill="#a16207"/>
    <!-- Bumps on top -->
    <ellipse cx="-60" cy="-58" rx="20" ry="6" fill="#b45309"/>
    <ellipse cx="0" cy="-62" rx="22" ry="7" fill="#b45309"/>
    <ellipse cx="60" cy="-58" rx="20" ry="6" fill="#b45309"/>
    <!-- Seeds on top -->
    <circle cx="-70" cy="-55" r="1.5" fill="#1e293b"/>
    <circle cx="-50" cy="-58" r="1.5" fill="#1e293b"/>
    <circle cx="-30" cy="-55" r="1.5" fill="#1e293b"/>
    <circle cx="-10" cy="-58" r="1.5" fill="#1e293b"/>
    <circle cx="10" cy="-60" r="1.5" fill="#1e293b"/>
    <circle cx="30" cy="-58" r="1.5" fill="#1e293b"/>
    <circle cx="50" cy="-55" r="1.5" fill="#1e293b"/>
    <circle cx="70" cy="-58" r="1.5" fill="#1e293b"/>
    <!-- A few slice marks -->
    <line x1="-40" y1="-40" x2="-40" y2="70" stroke="#451a03" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="-40" x2="0" y2="70" stroke="#451a03" stroke-width="1" opacity="0.3"/>
    <line x1="40" y1="-40" x2="40" y2="70" stroke="#451a03" stroke-width="1" opacity="0.3"/>
  </g>
</svg>